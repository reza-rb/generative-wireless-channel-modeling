
## `configs/realnvp_rayleigh.yaml`

```yaml
experiment:
  name: realnvp_rayleigh_baseline
  seed: 42
  device: auto

channel:
  type: rayleigh
  num_samples: 10000
  sigma: 1.0

data:
  batch_size: 256
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  shuffle: true

model:
  type: realnvp
  input_dim: 2
  num_coupling_layers: 6
  hidden_dim: 128
  num_hidden_layers: 2

training:
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0
  grad_clip_norm: 5.0

evaluation:
  num_generated_samples: 5000
  save_plots: true

paths:
  results_dir: results
  figures_dir: results/figures
  checkpoints_dir: results/checkpoints