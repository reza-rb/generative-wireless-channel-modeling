[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-wireless-channel-modeling"
version = "0.1.0"
description = "Normalizing flows for density modeling of wireless channel coefficients."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Reza Roushanbakhsh" }
]
keywords = [
    "normalizing-flows",
    "wireless-communications",
    "rayleigh-fading",
    "rician-fading",
    "generative-ai",
    "pytorch",
    "density-estimation"
]

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true